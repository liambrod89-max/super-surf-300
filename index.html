<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supersurf</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f0f1a,#1b1b2e);
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.box{
  width:90%;
  max-width:600px;
  text-align:center;
}

.logo{
  font-size:70px;
  font-weight:bold;
  margin-bottom:30px;
}

input{
  width:100%;
  padding:15px;
  border:none;
  border-radius:30px;
  font-size:18px;
  outline:none;
}

button{
  margin-top:15px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:30px;
  background:#ff2d75;
  color:white;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 0 15px #ff2d75;
}

button:hover{
  transform:scale(1.03);
}

.small{
  margin-top:15px;
  font-size:12px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="box">

  <h1 class="logo">
    <span style="color:#4285F4;">S</span>
    <span style="color:#EA4335;">u</span>
    <span style="color:#FBBC05;">p</span>
    <span style="color:#34A853;">e</span>
    <span style="color:#4285F4;">r</span>
    <span style="color:#EA4335;">s</span>
    <span style="color:#FBBC05;">u</span>
    <span style="color:#34A853;">r</span>
    <span style="color:#4285F4;">f</span>
  </h1>

  <input id="q" placeholder="Suche oder URL eingeben">

  <button onclick="go()">Suchen</button>

  <div class="small">
    Powered by Google Search
  </div>

</div>

<script>
function go(){
  let q = document.getElementById("q").value.trim();

  if(!q) return;

  let url;

  // Wenn URL eingegeben wurde
  if(q.includes(".") && !q.includes(" ")){
    if(!q.startsWith("http")){
      q = "https://" + q;
    }

    url = q;
  }

  // Normale Suche
  else{
    url =
      "https://www.google.com/search?q="
      + encodeURIComponent(q);
  }

  window.open(url,"_blank");
}

document
.getElementById("q")
.addEventListener("keydown",function(e){

  if(e.key==="Enter"){
    go();
  }

});
</script>

</body>
</html>
