<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supersurf</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f0f1a,#1b1b2e);
  color:white;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

.clock{
  position:absolute;
  top:20px;
  right:20px;
  background:rgba(255,255,255,0.08);
  padding:10px 15px;
  border-radius:12px;
}

.box{
  width:90%;
  max-width:900px;
  text-align:center;
  background:rgba(255,255,255,0.05);
  padding:30px;
  border-radius:25px;
  backdrop-filter:blur(10px);
}

/* LOGO */
.logo{
  font-size:65px;
  margin-bottom:20px;
}

/* INPUT */
input{
  width:100%;
  padding:15px;
  border:none;
  border-radius:40px;
  font-size:18px;
}

/* BUTTON */
button{
  margin-top:10px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:40px;
  background:#ff2d75;
  color:white;
  font-size:18px;
  cursor:pointer;
}

/* IFRAME RESULT */
iframe{
  margin-top:20px;
  width:100%;
  height:400px;
  border:none;
  border-radius:15px;
  background:white;
}

</style>
</head>

<body>

<div class="clock" id="clock">00:00:00</div>

<div class="box">

  <div class="logo">
    <span style="color:#4285F4;">S</span>
    <span style="color:#EA4335;">u</span>
    <span style="color:#FBBC05;">p</span>
    <span style="color:#34A853;">e</span>
    <span style="color:#4285F4;">r</span>
    <span style="color:#EA4335;">s</span>
    <span style="color:#FBBC05;">u</span>
    <span style="color:#34A853;">r</span>
    <span style="color:#4285F4;">f</span>
  </div>

  <input id="q" placeholder="Suche oder URL eingeben">
  <button onclick="go()">Suchen</button>

  <iframe id="frame"></iframe>

</div>

<script>

/* CLOCK */
function updateClock(){
  let d = new Date();
  document.getElementById("clock").innerText =
    d.getHours().toString().padStart(2,"0") + ":" +
    d.getMinutes().toString().padStart(2,"0") + ":" +
    d.getSeconds().toString().padStart(2,"0");
}
setInterval(updateClock,1000);
updateClock();

/* SEARCH INSIDE BROWSER */
function go(){
  let q = document.getElementById("q").value.trim();
  if(!q) return;

  let url;

  if(q.includes(".") && !q.includes(" ")){
    if(!q.startsWith("http")) q = "https://" + q;
    url = q;
  } else {
    url = "https://duckduckgo.com/?q=" + encodeURIComponent(q);
  }

  document.getElementById("frame").src = url;
}

</script>

</body>
</html>
